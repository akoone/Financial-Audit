services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Uses the bundled Postgres below unless DATABASE_URL is set in .env (e.g. Neon)
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://finance:finance@db:5432/finance}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
