<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Money</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.1/echarts.min.js"></script>
<style>
  /* Fallbacks for opening outside Telegram; inside Telegram its theme colors win. */
  :root {
    color-scheme: light;
    --fb-page: #efeff3; --fb-card: #ffffff; --fb-text: #0b0b0b; --fb-hint: #77767d; --fb-link: #2a78d6;
    --fb-btn: #2a78d6; --fb-btn-text: #ffffff; --fb-sep: rgba(11, 11, 11, .10); --fb-danger: #d03b3b;
    --series-1: #2a78d6; --series-2: #eb6834; --track: #cde2fb;
    --good: #006300; --bad: #d03b3b; --grid: #e1e0d9; --axis: #c3c2b7; --ink-2: #52514e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --fb-page: #0d0d0d; --fb-card: #1c1c1d; --fb-text: #f0efec; --fb-hint: #8d8c93; --fb-link: #3987e5;
      --fb-btn: #3987e5; --fb-sep: rgba(255, 255, 255, .10);
      --series-1: #3987e5; --series-2: #d95926; --track: #0d366b;
      --good: #0ca30c; --grid: #2c2c2a; --axis: #383835; --ink-2: #c3c2b7;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --fb-page: #0d0d0d; --fb-card: #1c1c1d; --fb-text: #f0efec; --fb-hint: #8d8c93; --fb-link: #3987e5;
    --fb-btn: #3987e5; --fb-sep: rgba(255, 255, 255, .10);
    --series-1: #3987e5; --series-2: #d95926; --track: #0d366b;
    --good: #0ca30c; --grid: #2c2c2a; --axis: #383835; --ink-2: #c3c2b7;
  }
  :root {
    --page: var(--tg-theme-secondary-bg-color, var(--fb-page));
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, var(--fb-card)));
    --text: var(--tg-theme-text-color, var(--fb-text));
    --hint: var(--tg-theme-hint-color, var(--fb-hint));
    --link: var(--tg-theme-link-color, var(--fb-link));
    --accent: var(--tg-theme-button-color, var(--fb-btn));
    --accent-text: var(--tg-theme-button-text-color, var(--fb-btn-text));
    --sep: var(--tg-theme-section-separator-color, var(--fb-sep));
    --head: var(--tg-theme-section-header-text-color, var(--hint));
    --danger: var(--tg-theme-destructive-text-color, var(--fb-danger));
    --soft: rgba(127, 127, 127, .14);
    --safe-b: max(env(safe-area-inset-bottom, 0px), var(--tg-safe-area-inset-bottom, 0px));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--page); }
  body { margin: 0; min-height: 100vh; padding: 12px 16px calc(88px + var(--safe-b)); background: var(--page);
         color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font-family: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
  .loading { opacity: .55; transition: opacity .15s; pointer-events: none; }

  .card { background: var(--card); border-radius: 14px; padding: 14px 16px; margin: 0 0 12px; }
  .card h3 { margin: 0 0 8px; font-size: 15px; font-weight: 600; display: flex; align-items: center;
             justify-content: space-between; gap: 8px; }
  .card .note { color: var(--hint); font-size: 13px; margin: -4px 0 8px; }
  .muted { color: var(--hint); }
  .small { font-size: 13px; }
  .link { border: 0; background: none; color: var(--link); font-size: 14px; padding: 4px 0; font-weight: 500; }
  .section-title { color: var(--head); font-size: 13px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase;
                   margin: 18px 4px 6px; }

  .seg { display: flex; background: var(--soft); border-radius: 10px; padding: 2px; gap: 2px; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 8px 0; border-radius: 8px; font-size: 14px; font-weight: 600; }
  .seg button.on { background: var(--card); box-shadow: 0 1px 2px rgba(0, 0, 0, .15); }

  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 0; border-radius: 12px;
         padding: 13px 16px; font-size: 16px; font-weight: 600; background: var(--accent); color: var(--accent-text); }
  .btn.secondary { background: var(--card); color: var(--link); }
  .btn.plain { background: var(--soft); color: var(--text); }
  .btn.danger { background: var(--card); color: var(--danger); }
  .btn.danger-fill { background: var(--danger); color: #fff; }
  .btn:disabled { opacity: .5; }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  .btn-row .btn { flex: 1; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 2px; }
  .chips.scroll::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 0; border-radius: 999px; padding: 8px 12px; background: var(--card); font-size: 14px;
          white-space: nowrap; line-height: 1.2; }
  .card .chip, .sheet .card .chip { background: var(--soft); }
  .chip.on, .card .chip.on { background: var(--accent); color: var(--accent-text); }
  .chip.add { background: transparent; box-shadow: inset 0 0 0 1px var(--sep); color: var(--link); }
  details.archived > summary { cursor: pointer; list-style: none; }
  details.archived > summary::-webkit-details-marker { display: none; }
  details.archived > summary::after { content: " ▸"; }
  details.archived[open] > summary::after { content: " ▾"; }
  .btn-row .grow { flex: 1; min-width: 0; }
  .sw { position: relative; overflow: hidden; }
  .sw + .sw { border-top: 1px solid var(--sep); }
  .sw > .row { position: relative; z-index: 1; border-top: 0; background: var(--card); transition: transform .2s ease; touch-action: pan-y; }
  .sheet .sw > .row { background: var(--card); }
  .sw-acts { position: absolute; top: 0; bottom: 0; right: 0; display: flex; }
  .sw-btn { width: 84px; border: 0; color: #fff; font: inherit; font-size: 14px; font-weight: 600; }
  .sw-btn.del { background: var(--bad); }
  .sw-btn.arch { background: #8e8e93; }
  .sw-btn.ok { background: var(--accent); color: var(--accent-text); }
  .debt-tile { padding: 12px 14px !important; text-align: left; background: var(--card) !important; border-radius: 14px; }
  .entry-sub { font-size: 12px; color: var(--hint); }
  .label-row { display: flex; justify-content: space-between; align-items: baseline; }
  .label-row .link { margin: 0 4px 6px; padding: 0; }
  .cam { position: fixed; inset: 0; z-index: 60; background: #000; display: none; flex-direction: column; }
  .cam.open { display: flex; }
  .cam video { flex: 1; min-height: 0; width: 100%; object-fit: cover; background: #000; }
  .cam .frame { position: absolute; inset: 12% 8% 22%; border: 2px solid rgba(255,255,255,.75); border-radius: 16px; pointer-events: none; }
  .cam .hint { position: absolute; top: calc(env(safe-area-inset-top) + 16px); left: 0; right: 0; text-align: center; color: #fff;
               font-size: 15px; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  .cam .cam-bar { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 18px 28px calc(env(safe-area-inset-bottom) + 22px); background: #000; }
  .cam .cam-bar button { border: 0; background: none; color: #fff; font-size: 16px; min-width: 64px; min-height: 44px; }
  .cam .shutter { width: 72px; height: 72px; border-radius: 50%; background: #fff !important; box-shadow: 0 0 0 4px #000, 0 0 0 7px #fff; min-width: 72px !important; }
  .cam .shutter:active { transform: scale(.94); }
  input.chip.date { font: inherit; font-size: 14px; color: inherit; min-height: 34px; }

  .row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 0; border: 0;
         border-top: 1px solid var(--sep); background: none; text-align: left; font: inherit; }
  .row:first-child { border-top: 0; }
  .ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--soft);
         font-size: 18px; flex: none; }
  .row .main { flex: 1; min-width: 0; }
  .row .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { color: var(--hint); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .amt { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .row .amt .sub { font-size: 12px; }
  .pos { color: var(--good); }
  .neg { color: var(--bad); }
  .star { color: #eda100; }

  .hero-label { color: var(--hint); font-size: 14px; margin-top: 16px; }
  .hero { font-size: 48px; font-weight: 700; letter-spacing: -.02em; line-height: 1.12; white-space: nowrap; overflow: hidden; }
  .hero small { font-size: 18px; font-weight: 600; color: var(--hint); margin-left: 6px; letter-spacing: 0; }
  .delta { font-size: 13px; margin-top: 2px; color: var(--hint); }
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 14px 0 12px; }
  .tile { background: var(--card); border-radius: 14px; padding: 10px 12px; min-width: 0; border: 0; text-align: left; font: inherit; color: inherit; }
  .nw-hint { width: 100%; border: 0; text-align: left; font: inherit; color: inherit; }
  .tile .l { color: var(--hint); font-size: 12px; }
  .tile .v { font-size: 18px; font-weight: 650; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .d { font-size: 12px; color: var(--hint); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .rank { display: block; width: 100%; border: 0; background: none; text-align: left; padding: 8px 0; font: inherit; }
  .rank .top { display: flex; align-items: baseline; gap: 8px; font-size: 14px; }
  .rank .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rank .val { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rank .share { color: var(--hint); font-size: 12px; width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; border-radius: 3px; background: var(--track); margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; background: var(--series-1); }

  .chart { width: 100%; height: 210px; }
  .chart-card .tbl-wrap { display: none; max-height: 320px; overflow-y: auto; }
  .chart-card.show-table .tbl-wrap { display: block; }
  .chart-card.show-table .chart { display: none; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  .tbl th, .tbl td { padding: 6px 4px; border-top: 1px solid var(--sep); text-align: right; white-space: nowrap; }
  .tbl th:first-child, .tbl td:first-child { text-align: left; white-space: normal; }
  .tbl th { color: var(--hint); font-weight: 500; border-top: 0; }
  .tbl tr.total td { font-weight: 650; }

  .banner { display: flex; gap: 10px; align-items: center; background: var(--card); border-radius: 14px; padding: 12px 14px;
            margin-bottom: 12px; font-size: 14px; }
  .banner .grow { flex: 1; }
  .banner .btn { width: auto; padding: 8px 12px; font-size: 14px; }
  .banner .x { border: 0; background: none; color: var(--hint); font-size: 18px; padding: 0 2px; }

  .field { margin-top: 16px; }
  .label { display: block; color: var(--head); font-size: 13px; font-weight: 500; margin: 0 4px 6px; }
  .inp { width: 100%; border: 0; border-radius: 12px; padding: 12px 14px; background: var(--card); color: var(--text);
         font: inherit; font-size: 16px; outline: none; -webkit-appearance: none; appearance: none; }
  .sheet .inp { background: var(--card); }
  .inp:focus { box-shadow: inset 0 0 0 2px var(--accent); }
  select.inp { background-image: linear-gradient(45deg, transparent 50%, var(--hint) 50%), linear-gradient(135deg, var(--hint) 50%, transparent 50%);
               background-position: calc(100% - 20px) 55%, calc(100% - 15px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
  .amount-box { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 14px; padding: 4px 8px 4px 16px; }
  .amount-box input { flex: 1; min-width: 0; border: 0; background: none; color: var(--text); font: inherit; font-size: 34px;
                      font-weight: 700; outline: none; padding: 8px 0; }
  .amount-box select, .amount-box .cur { border: 0; background: var(--soft); color: var(--text); border-radius: 10px; padding: 8px 10px;
                      font: inherit; font-size: 16px; font-weight: 600; -webkit-appearance: none; appearance: none; }

  .search { margin-bottom: 10px; }
  .monthnav { display: flex; align-items: center; justify-content: space-between; margin: 12px 0 4px; }
  .monthnav b { font-size: 16px; }
  .monthnav button { border: 0; background: var(--card); width: 36px; height: 36px; border-radius: 50%; font-size: 20px; line-height: 1; color: var(--link); }
  .monthnav button:disabled { opacity: .35; }
  .sum { color: var(--hint); font-size: 13px; margin: 0 4px 6px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: var(--accent-text); border: 0;
          border-radius: 999px; padding: 6px 12px; font-size: 13px; margin-top: 10px; }
  .dayhead { display: flex; justify-content: space-between; color: var(--head); font-size: 13px; font-weight: 500;
             margin: 16px 4px 6px; font-variant-numeric: tabular-nums; }
  .card.list { padding-top: 2px; padding-bottom: 2px; }
  .empty { text-align: center; color: var(--hint); padding: 28px 12px; }
  .empty .big { font-size: 34px; margin-bottom: 6px; }

  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--sep);
        font-variant-numeric: tabular-nums; }
  .kv:first-child { border-top: 0; }
  .kv .k { color: var(--hint); }
  .kv.strong { font-weight: 650; }
  .kv.strong .k { color: var(--text); }

  .switch-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--sep); }
  .switch-row:first-child { border-top: 0; }
  .switch-row .grow { flex: 1; }
  .switch-row input[type=time] { border: 0; background: var(--soft); color: var(--text); border-radius: 8px; padding: 6px 8px; font: inherit; }
  .switch { position: relative; width: 46px; height: 28px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--soft); transition: .2s; }
  .switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%;
                        background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: .2s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(18px); }

  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; align-items: flex-end;
            background: var(--card); border-top: 1px solid var(--sep); padding: 6px 4px calc(6px + var(--safe-b)); }
  .tabbar button { flex: 1; border: 0; background: none; color: var(--hint); display: flex; flex-direction: column;
                   align-items: center; gap: 2px; font-size: 11px; font-weight: 500; padding: 2px 0; }
  .tabbar button.on { color: var(--accent); }
  .tabbar svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .tabbar .plus .circle { width: 46px; height: 46px; margin-top: -16px; border-radius: 50%; background: var(--accent); color: var(--accent-text);
                          display: grid; place-items: center; box-shadow: 0 3px 10px rgba(0, 0, 0, .22); }
  .tabbar .plus .circle svg { width: 26px; height: 26px; stroke-width: 2.4; }
  body.typing .tabbar { display: none; }

  .backdrop { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .4); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-height: 90vh; overflow-y: auto; overscroll-behavior: contain;
           background: var(--page); border-radius: 16px 16px 0 0; padding: 8px 16px calc(20px + var(--safe-b));
           transform: translateY(105%); transition: transform .25s ease; }
  .sheet.open { transform: none; }
  .grab { width: 36px; height: 5px; border-radius: 3px; background: rgba(127, 127, 127, .45); margin: 0 auto 12px; }
  .sheet h2 { font-size: 18px; margin: 0 0 12px; display: flex; align-items: center; gap: 10px; }

  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(84px + var(--safe-b)); z-index: 40; display: flex; align-items: center;
           gap: 12px; background: rgba(28, 28, 30, .95); color: #fff; border-radius: 12px; padding: 12px 14px; font-size: 14px;
           opacity: 0; transform: translateY(16px); pointer-events: none; transition: opacity .2s, transform .2s; }
  .toast.show { opacity: 1; transform: none; pointer-events: auto; }
  .toast button { margin-left: auto; border: 0; background: none; color: #8ec0ff; font-size: 15px; font-weight: 600; padding: 0; }
  /* Tablets, Telegram Desktop and wide windows: keep a phone-like column in the middle */
  @media (min-width: 700px) {
    .view { max-width: 640px; margin-left: auto; margin-right: auto; }
    .tabbar { left: 50%; right: auto; width: 100%; max-width: 672px; transform: translateX(-50%); border-radius: 16px 16px 0 0; }
    .sheet { left: 0; right: 0; margin: 0 auto; max-width: 672px; }
    .toast { left: 50%; right: auto; width: 100%; max-width: 640px; margin-left: -320px; }
  }
  .hist-item { font-size: 13px; padding: 6px 0; border-top: 1px solid var(--sep); }
  .hist-item:first-child { border-top: 0; }
</style>
</head>
<body>
<div id="fatal" class="card" hidden></div>

<section class="view" id="v-setup" hidden></section>
<section class="view" id="v-home" hidden></section>
<section class="view" id="v-history" hidden>
  <div class="search"><input class="inp" id="h-q" type="search" placeholder="Search notes, shops, categories" enterkeyhint="search" autocomplete="off"></div>
  <div class="chips scroll" id="h-types">
    <button class="chip on" data-type="">All</button>
    <button class="chip" data-type="expense">Spending</button>
    <button class="chip" data-type="income">Income</button>
    <button class="chip" data-type="transfer">Transfers</button>
    <button class="chip" data-type="adjustment">Corrections</button>
  </div>
  <div id="h-filter"></div>
  <div class="monthnav" id="h-nav">
    <button type="button" data-m="-1" aria-label="Previous month">‹</button>
    <b id="h-month"></b>
    <button type="button" data-m="1" aria-label="Next month">›</button>
  </div>
  <div id="h-sum" class="sum"></div>
  <div id="h-list"></div>
</section>
<section class="view" id="v-add" hidden></section>
<section class="view" id="v-accounts" hidden></section>
<section class="view" id="v-more" hidden></section>
<section class="view" id="v-debts" hidden></section>

<nav class="tabbar" id="tabbar" hidden>
  <button type="button" data-view="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.8V20h13V9.8"/></svg>Overview</button>
  <button type="button" data-view="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>History</button>
  <button type="button" data-view="add" class="plus" aria-label="Add"><span class="circle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>Add</button>
  <button type="button" data-view="accounts"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M16 14.5h2"/></svg>Accounts</button>
  <button type="button" data-view="more"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h9l3 3v13H6z"/><path d="M9 11h6M9 15h6"/></svg>Statement</button>
</nav>

<div class="backdrop" id="backdrop"></div>
<div class="cam" id="cam" role="dialog" aria-modal="true" aria-label="Camera">
  <video id="cam-video" playsinline muted autoplay></video><div class="frame"></div>
  <div class="hint">Fit the whole check inside the frame</div>
  <div class="cam-bar"><button type="button" id="cam-close">Cancel</button>
    <button type="button" class="shutter" id="cam-shot" aria-label="Take photo"></button>
    <button type="button" id="cam-gallery">Gallery</button></div>
</div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheet-body"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const tg = window.Telegram && window.Telegram.WebApp;
const ver = v => !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v));
const initData = (tg && tg.initData) || "";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const nf = new Intl.NumberFormat(undefined, {maximumFractionDigits: 2});
const cf = new Intl.NumberFormat(undefined, {notation: "compact", maximumFractionDigits: 1});
const num = v => nf.format(Math.abs(v));
const money = (v, c) => (v < 0 ? "−" : "") + nf.format(Math.abs(v)) + (c ? " " + c : "");
const signed = (v, c) => (v > 0 ? "+" : v < 0 ? "−" : "") + nf.format(Math.abs(v)) + (c ? " " + c : "");
const short = v => (v < 0 ? "−" : "") + (Math.abs(v) >= 1e6 ? cf.format(Math.abs(v)) : nf.format(Math.round(Math.abs(v))));
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d || 1); };

const yesterdayIso = () => { const d = new Date(); d.setDate(d.getDate() - 1); return iso(d); };

// ---------- plumbing ----------
async function api(path, {method = "GET", body, raw} = {}) {
  const headers = {"X-Telegram-Init-Data": initData};
  let payload;
  if (raw) { payload = raw; headers["Content-Type"] = raw.type || "image/jpeg"; }
  else if (body !== undefined) { payload = JSON.stringify(body); headers["Content-Type"] = "application/json"; }
  let r;
  try { r = await fetch(path, {method, headers, body: payload}); }
  catch (e) { throw new Error("No connection. Check the internet and try again."); }
  let data = null;
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) {
    const d = data && data.detail;
    if (r.status === 401) throw new Error("Please close and reopen the app from the bot.");
    throw new Error(typeof d === "string" ? d : `Something went wrong (${r.status})`);
  }
  return data;
}
function haptic(kind) {
  if (!ver("6.1")) return;
  try { kind === "light" ? tg.HapticFeedback.impactOccurred("light") : tg.HapticFeedback.notificationOccurred(kind); } catch (e) {}
}
function toast(text, action) {
  const t = $("#toast");
  t.innerHTML = `<span>${esc(text)}</span>` + (action ? `<button type="button">${esc(action.label)}</button>` : "");
  if (action) t.querySelector("button").onclick = () => { t.classList.remove("show"); action.run(); };
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), action ? 5500 : 2800);
}
const sheetOpen = () => $("#sheet").classList.contains("open");
function openSheet(html, mount) {
  $("#sheet-body").innerHTML = html;
  $("#sheet").scrollTop = 0;
  $("#sheet").classList.add("open");
  $("#backdrop").classList.add("open");
  document.body.style.overflow = "hidden";
  if (mount) mount($("#sheet-body"));
  updateBack();
}
function closeSheet() {
  $("#sheet").classList.remove("open");
  $("#backdrop").classList.remove("open");
  document.body.style.overflow = "";
  document.body.classList.remove("typing");
  updateBack();
}
function confirmAsk(text, okLabel = "Delete") {
  return new Promise(resolve => {
    if (ver("6.2")) { tg.showConfirm(text, ok => resolve(!!ok)); return; }
    openSheet(`<p style="margin:6px 4px 16px">${esc(text)}</p><button class="btn danger-fill" data-ok>${esc(okLabel)}</button>
      <button class="btn plain" style="margin-top:8px" data-no>Cancel</button>`, root => {
      root.querySelector("[data-ok]").onclick = () => { closeSheet(); resolve(true); };
      root.querySelector("[data-no]").onclick = () => { closeSheet(); resolve(false); };
    });
  });
}
function updateBack() {
  if (!ver("6.1")) return;
  if (camStream || sheetOpen() || S.view !== "home") tg.BackButton.show(); else tg.BackButton.hide();
}
function goBack() { if (camStream) closeCamera(); else if (sheetOpen()) closeSheet(); else show(S.view === "debts" ? "accounts" : "home"); }
function errorCard(msg) { return `<div class="card"><b>Couldn't load</b><div class="muted small" style="margin-top:4px">${esc(msg)}</div></div>`; }
function tokens() {
  const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
  return {s1: v("--series-1"), s2: v("--series-2"), text: v("--text"), hint: v("--hint"), ink2: v("--ink-2"), grid: v("--grid"),
          axis: v("--axis"), card: v("--card"), sep: v("--sep")};
}
function applyTheme() {
  const dark = tg && tg.colorScheme ? tg.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  if (ver("6.1")) { try { tg.setHeaderColor("secondary_bg_color"); tg.setBackgroundColor("secondary_bg_color"); } catch (e) {} }
}
function fitText(el, max = 48, min = 26) {
  if (!el) return;
  let size = max;
  el.style.fontSize = size + "px";
  while (el.scrollWidth > el.clientWidth && size > min) { size -= 2; el.style.fontSize = size + "px"; }
}

function renderCharts() {
  Object.values(charts).forEach(ch => ch.dispose());
  charts = {};
  const d = S.dash, c = d.currency;
  if (!window.echarts) {  // charts library blocked: show the tables instead
    $$(".chart-card").forEach(card => { card.classList.add("show-table"); const b = card.querySelector("[data-table]"); if (b) b.hidden = true; });
    return;
  }
  const k = tokens();
  const axis = {axisLabel: {color: k.hint, fontSize: 11}, axisLine: {lineStyle: {color: k.axis}}, axisTick: {show: false},
                splitLine: {lineStyle: {color: k.grid, width: 1}}};
  const yAxis = {type: "value", ...axis, axisLine: {show: false}, splitNumber: 3, axisLabel: {...axis.axisLabel, formatter: v => cf.format(v)}};
  const tip = {backgroundColor: k.card, borderColor: k.sep, textStyle: {color: k.text, fontSize: 13}, confine: true};
  const make = id => { const node = document.getElementById(id); return node ? (charts[id] = echarts.init(node)) : null; };

  const daily = make("c-daily");
  if (daily) {
    const pts = d.daily.filter(x => x.date <= d.today);
    daily.setOption({
      animation: false, grid: {left: 4, right: 6, top: 10, bottom: 2, containLabel: true},
      tooltip: {...tip, trigger: "axis", axisPointer: {type: "shadow", shadowStyle: {color: "rgba(127,127,127,.12)"}},
                formatter: ps => `${esc(dayLabel(pts[ps[0].dataIndex].date))}<br><b>${esc(money(ps[0].value, c))}</b>`},
      xAxis: {type: "category", data: pts.map(x => d.period === "year" ? parseD(x.date).toLocaleDateString(undefined, {month: "short"}) : String(parseD(x.date).getDate())), ...axis},
      yAxis,
      series: [{type: "bar", data: pts.map(x => x.value), barMaxWidth: 24, itemStyle: {color: k.s1, borderRadius: [4, 4, 0, 0]}}],
    });
  }
  const months = make("c-months");
  if (months) {
    months.setOption({
      animation: false, grid: {left: 4, right: 6, top: 34, bottom: 2, containLabel: true},
      legend: {top: 0, left: 0, icon: "roundRect", itemWidth: 10, itemHeight: 10, itemGap: 16, textStyle: {color: k.ink2, fontSize: 12}},
      tooltip: {...tip, trigger: "axis", axisPointer: {type: "shadow", shadowStyle: {color: "rgba(127,127,127,.12)"}},
                formatter: ps => { const m = d.months[ps[0].dataIndex];
                  return `${esc(monthLabel(m.month))}<br>Income <b>${esc(money(m.income, c))}</b><br>Spent <b>${esc(money(m.expense, c))}</b><br>Saved <b>${esc(money(m.income - m.expense, c))}</b>`; }},
      xAxis: {type: "category", data: d.months.map(m => parseD(m.month + "-01").toLocaleDateString(undefined, {month: "narrow"})), ...axis},
      yAxis,
      series: [
        {name: "Income", type: "bar", data: d.months.map(m => m.income), barMaxWidth: 10, barGap: "20%", itemStyle: {color: k.s1, borderRadius: [4, 4, 0, 0]}},
        {name: "Spending", type: "bar", data: d.months.map(m => m.expense), barMaxWidth: 10, itemStyle: {color: k.s2, borderRadius: [4, 4, 0, 0]}},
      ],
    });
  }
  const nw = make("c-nw");
  if (nw) {
    const h = d.net_worth_history;
    nw.setOption({
      animation: false, grid: {left: 4, right: 52, top: 12, bottom: 2, containLabel: true},
      tooltip: {...tip, trigger: "axis", axisPointer: {type: "line", lineStyle: {color: k.axis}},
                formatter: ps => `${esc(dayLabel(h[ps[0].dataIndex].date))}<br><b>${esc(money(ps[0].value, c))}</b>`},
      xAxis: {type: "category", boundaryGap: false, data: h.map(p => parseD(p.date).toLocaleDateString(undefined, {day: "numeric", month: "short"})), ...axis},
      yAxis: {...yAxis, scale: true},
      series: [{type: "line", data: h.map(p => p.value), showSymbol: false, symbolSize: 8, lineStyle: {width: 2, color: k.s1},
                itemStyle: {color: k.s1, borderColor: k.card, borderWidth: 2}, areaStyle: {color: k.s1, opacity: .1},
                endLabel: {show: true, color: k.text, fontSize: 11, formatter: p => cf.format(p.value)}}],
    });
  }

// ---------- swipe a row left to reveal actions (delete, archive) ----------
function closeSwipes(except) {
  $$(".sw.open").forEach(w => { if (w !== except) { w.classList.remove("open"); w.lastElementChild.style.transform = ""; } });
}
function swipeRows(container, selector, actionsFor) {
  $$(selector, container).forEach(row => {
    if (row.parentNode.classList.contains("sw")) return;
    const acts = actionsFor(row);
    if (!acts || !acts.length) return;
    const wrap = document.createElement("div"); wrap.className = "sw";
    row.parentNode.insertBefore(wrap, row);
    const back = document.createElement("div"); back.className = "sw-acts";
    for (const a of acts) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "sw-btn " + (a.cls || "del"); b.textContent = a.label;
      b.onclick = e => { e.stopPropagation(); closeSwipes(); a.run(); };
      back.appendChild(b);
    }
    wrap.appendChild(back); wrap.appendChild(row);
    const W = 84 * acts.length;
    let x0 = null, y0 = 0, dx = 0, drag = false, swiped = false;
    row.addEventListener("touchstart", e => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; drag = false; row.style.transition = "none"; }, {passive: true});
    row.addEventListener("touchmove", e => {
      if (x0 === null) return;
      const t = e.touches[0], mx = t.clientX - x0, my = t.clientY - y0;
      if (!drag) {
        if (Math.abs(mx) > 10 && Math.abs(mx) > Math.abs(my) * 1.3) { drag = true; closeSwipes(wrap); }
        else if (Math.abs(my) > 10) { x0 = null; row.style.transition = ""; return; }
        else return;
      }
      dx = Math.min(0, Math.max(-W - 40, (wrap.classList.contains("open") ? -W : 0) + mx));
      row.style.transform = `translateX(${dx}px)`;
    }, {passive: true});
    const end = () => {
      if (x0 === null) return;
      x0 = null; row.style.transition = "";
      if (!drag) return;
      const open = dx < -W / 2;
      wrap.classList.toggle("open", open);
      row.style.transform = open ? `translateX(${-W}px)` : "";
      if (open) haptic("light");
      swiped = true; setTimeout(() => { swiped = false; }, 80);
    };
    row.addEventListener("touchend", end); row.addEventListener("touchcancel", end);
    row.addEventListener("click", e => {  // a swipe, or a tap on an open row, doesn't open the item
      if (swiped || wrap.classList.contains("open")) {
        e.stopImmediatePropagation(); e.preventDefault();
        if (!swiped) closeSwipes();
      }
    }, true);
  });
}
document.addEventListener("touchstart", e => { const t = e.target; if (!(t && t.closest && t.closest(".sw.open"))) closeSwipes(); }, {passive: true});

async function loadHistory() {

  }
  const groups = new Map();
  for (const t of data.items) { if (!groups.has(t.date)) groups.set(t.date, []); groups.get(t.date).push(t); }
  let html = "";
  for (const [day, items] of groups) {
    const net = items.reduce((s, t) => s + (t.type === "income" || t.type === "expense" ? t.base_amount : 0), 0);

  if (data.has_more) html += `<div class="muted small" style="text-align:center;margin:12px">Showing the latest 300. Use search or the months to see more.</div>`;

  $$(".tx", list).forEach(b => b.onclick = () => openTx(+b.dataset.tx));

function shrink(file, max = 2000) {
  return new Promise(resolve => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      if (k === 1 && file.size < 3e6 && /jpe?g|png|webp/.test(file.type)) { URL.revokeObjectURL(url); resolve(file); return; }
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(b => resolve(b || file), "image/jpeg", 0.9);
    };

async function openCamera(fallback) {
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) { fallback(); return; }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({audio: false,
      video: {facingMode: {ideal: "environment"}, width: {ideal: 1920}, height: {ideal: 1080}}});
  } catch (e) {
    camStream = null;
    if (e && e.name === "NotAllowedError") toast("Camera access is off for Telegram. Opening the phone camera instead.");
    fallback(); return;
  }
  const v = $("#cam-video");
  v.srcObject = camStream;
  $("#cam").classList.add("open");
  updateBack();
  try { await v.play(); } catch (e) {}
  $("#cam-close").onclick = closeCamera;
  $("#cam-gallery").onclick = () => { closeCamera(); $("#a-file").click(); };
  $("#cam-shot").onclick = () => {
    if (!v.videoWidth) return;
    const cv = document.createElement("canvas");
    cv.width = v.videoWidth; cv.height = v.videoHeight;
    cv.getContext("2d").drawImage(v, 0, 0);
    haptic("light");

    cv.toBlob(b => b && scanFile(b), "image/jpeg", 0.92);
  };
}

  box.classList.add("loading");

    const st = await api(`/api/statement?month=${month}`);

      ${st.change != null ? `<div class="kv strong"><span class="k">Change</span><span class="${st.change < 0 ? "neg" : "pos"}">${esc(signed(st.change, c))}</span></div>` : ""}
      <div class="kv"><span class="k">Income</span><span>${esc(money(st.income, c))}</span></div>

      <div class="kv"><span class="k">Saved (income − spending)</span><span>${esc(signed(st.saved, c))}</span></div>
      ${st.other != null ? `<div class="kv"><span class="k">Value, exchange-rate changes and corrections</span><span>${esc(signed(st.other, c))}</span></div>` : ""}
      ${st.opening ? "" : `<div class="muted small" style="margin-top:8px">There's no record from before this month yet, so the opening balance is unknown. A record is saved every night from now on.</div>`}
      </div>
      <div class="card"><h3>Accounts, start → end <span class="muted small" style="font-weight:400">${esc(c)}</span></h3>
        <table class="tbl"><tr><th>Account</th><th>Start</th><th>End</th></tr>
        ${st.lines.map(l => `<tr><td>${esc(l.account)}</td><td>${esc(short(l.opening))}</td><td>${esc(short(l.closing))}</td></tr>`).join("")}
        <tr class="total"><td>Net worth</td><td>${st.opening ? esc(short(st.opening.net_worth)) : "–"}</td><td>${esc(short(st.closing.net_worth))}</td></tr></table>
        <button class="btn plain" id="st-send" style="margin-top:12px">Send this statement to the chat (CSV)</button></div>`;
    $("#st-send").onclick = async e => {
      e.target.disabled = true;
      try { await api("/api/send", {method: "POST", body: {what: "statement", month}}); haptic("success"); toast("Sent. Check your chat with the bot."); }
      catch (err) { toast(err.message); } finally { e.target.disabled = false; }
    };
  } catch (e) { if (S.stmtMonth === month) box.innerHTML = errorCard(e.message); }
  finally { box.classList.remove("loading"); }
}

  $("#backdrop").onclick = closeSheet;
  let qTimer = null;
  $("#h-q").oninput = e => { clearTimeout(qTimer); qTimer = setTimeout(() => { S.hist.q = e.target.value.trim(); loadHistory(); drawHistoryHeader(); }, 300); };
  $$("#h-types .chip").forEach(b => b.onclick = () => {
    S.hist.type = b.dataset.type;
    $$("#h-types .chip").forEach(x => x.classList.toggle("on", x === b));
    loadHistory();
  });
  $$("#h-nav [data-m]").forEach(b => b.onclick = () => { S.hist.month = addMonths(S.hist.month, +b.dataset.m); drawHistoryHeader(); loadHistory(); });
  document.addEventListener("focusin", e => { if (e.target.matches("input:not([type=checkbox]):not([type=file]), select, textarea")) document.body.classList.add("typing"); });
  document.addEventListener("focusout", () => setTimeout(() => {
    if (!document.activeElement || !document.activeElement.matches("input, select, textarea")) document.body.classList.remove("typing");
  }, 50));
  window.addEventListener("resize", () => Object.values(charts).forEach(ch => ch.resize()));
}
async function boot() {
  if (tg) {
    tg.ready();
    tg.expand();
    if (ver("7.7")) { try { tg.disableVerticalSwipes(); } catch (e) {} }
    if (ver("6.1")) tg.BackButton.onClick(goBack);
    tg.onEvent("themeChanged", () => { applyTheme(); if (S.view === "home" && S.dash) renderCharts(); });
  }
  applyTheme();
  bindOnce();
  const qs = new URLSearchParams(location.search);
  if (["day", "week", "month", "year"].includes(qs.get("period"))) S.period = qs.get("period");
  if (!initData) {
    const f = $("#fatal");
    f.hidden = false;
    f.innerHTML = `<b>Open this app from Telegram</b><div class="muted" style="margin-top:6px">In your chat with the bot, tap <b>Open app</b> next to the message box, or send <b>/app</b>.</div>`;
    return;
  }
  try { S.me = await api("/api/me"); }
  catch (e) { const f = $("#fatal"); f.hidden = false; f.innerHTML = `<b>Couldn't open the app</b><div class="muted" style="margin-top:6px">${esc(e.message)}</div>`; return; }
  if (!S.me.exists) { showSetup(); return; }
  startApp(qs.get("tab") || "home");
}
boot();
</script>
