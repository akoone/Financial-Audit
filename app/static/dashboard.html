<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Money dashboard</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.1/echarts.min.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --fg: var(--tg-theme-text-color, #1b1b1f);
    --muted: var(--tg-theme-hint-color, #8a8a93);
    --card: var(--tg-theme-secondary-bg-color, #f3f4f6);
    --accent: var(--tg-theme-button-color, #2a78d6);
    --accent-fg: var(--tg-theme-button-text-color, #ffffff);
    --pos: #19a979; --neg: #e5484d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px 16px 32px; background: var(--bg); color: var(--fg);
         font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button { flex: 1; padding: 8px 0; border: 0; border-radius: 10px; background: var(--card);
                 color: var(--fg); font-weight: 600; font-size: 14px; }
  .tabs button.on { background: var(--accent); color: var(--accent-fg); }
  .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
  .kpi { background: var(--card); border-radius: 12px; padding: 10px 12px; }
  .kpi .l { color: var(--muted); font-size: 12px; }
  .kpi .v { font-size: 19px; font-weight: 700; margin-top: 2px; }
  .kpi .d { font-size: 12px; margin-top: 2px; }
  .card { background: var(--card); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 6px; font-size: 14px; }
  .chart { width: 100%; height: 260px; }
  .tx { display: flex; justify-content: space-between; gap: 8px; padding: 7px 0;
        border-bottom: 1px solid rgba(127,127,127,.15); font-size: 14px; }
  .tx:last-child { border: 0; }
  .tx .w { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tx .s { color: var(--muted); font-size: 12px; }
  .pos { color: var(--pos); } .neg { color: var(--neg); }
  .filter { font-size: 12px; color: var(--accent); cursor: pointer; float: right; }
  #err { color: var(--neg); padding: 20px 0; display: none; }
</style>
</head>
<body>
<div class="tabs" id="tabs">
  <button data-p="day">Day</button><button data-p="week">Week</button>
  <button data-p="month">Month</button><button data-p="year">Year</button>
</div>
<div id="err"></div>
<div class="kpis">
  <div class="kpi"><div class="l">Spent</div><div class="v" id="k-exp">–</div><div class="d" id="k-exp-d"></div></div>
  <div class="kpi"><div class="l">Income</div><div class="v" id="k-inc">–</div><div class="d" id="k-inc-d"></div></div>
  <div class="kpi"><div class="l">Net</div><div class="v" id="k-net">–</div><div class="d" id="k-sr"></div></div>
  <div class="kpi"><div class="l">Net worth</div><div class="v" id="k-nw">–</div><div class="d" id="k-nw-d"></div></div>
</div>
<div class="card"><h3>Spending by category <span class="s" style="font-weight:400;color:var(--muted)">tap a slice</span></h3><div id="c-cat" class="chart"></div></div>
<div class="card"><h3>Daily spending</h3><div id="c-daily" class="chart" style="height:220px"></div></div>
<div class="card"><h3>Income vs expenses, last 12 months</h3><div id="c-months" class="chart"></div></div>
<div class="card"><h3>Net worth over time</h3><div id="c-nw" class="chart" style="height:220px"></div></div>
<div class="card"><h3>Accounts</h3><div id="c-acc" class="chart" style="height:220px"></div></div>
<div class="card"><h3>Transactions <span class="filter" id="clear" hidden>show all ✕</span></h3><div id="txs"></div></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const PAL = ["#2a78d6","#e8743b","#19a979","#ed4a7b","#945ecf","#13a4b4","#d6a419","#6c8893","#ee6868","#525df4"];
const charts = {};
let data = null, filterCat = null;
const fmt = (v, c) => (v < 0 ? "−" : "") + Math.abs(v).toLocaleString(undefined, {maximumFractionDigits: 2}) + (c ? " " + c : "");
const esc = s => String(s ?? "").replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
function chart(id) { return charts[id] || (charts[id] = echarts.init(document.getElementById(id))); }
function delta(cur, prev, upIsBad) {
  if (!prev) return "";
  const p = (cur - prev) / prev * 100, bad = upIsBad ? p > 0 : p < 0;
  return `<span class="${bad ? "neg" : "pos"}">${p > 0 ? "▲" : "▼"} ${Math.abs(p).toFixed(0)}%</span> vs previous`;
}

async function load(period) {
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.p === period));
  const r = await fetch(`/api/dashboard?period=${period}`, {headers: {"X-Telegram-Init-Data": tg ? tg.initData : ""}});
  if (!r.ok) { const e = document.getElementById("err"); e.style.display = "block";
    e.textContent = r.status === 401 ? "Open this dashboard from the bot's button." : "Could not load data (" + r.status + ")."; return; }
  data = await r.json(); filterCat = null; render();
}

function render() {
  const c = data.currency, fg = css("--fg"), muted = css("--muted");
  document.getElementById("k-exp").textContent = fmt(data.expense, c);
  document.getElementById("k-exp-d").innerHTML = delta(data.expense, data.prev_expense, true);
  document.getElementById("k-inc").textContent = fmt(data.income, c);
  document.getElementById("k-inc-d").innerHTML = delta(data.income, data.prev_income, false);
  const net = document.getElementById("k-net"); net.textContent = fmt(data.net, c);
  net.className = "v " + (data.net >= 0 ? "pos" : "neg");
  document.getElementById("k-sr").textContent = data.savings_rate != null ? `savings rate ${data.savings_rate.toFixed(0)}%` : "";
  document.getElementById("k-nw").textContent = fmt(data.net_worth, c);
  document.getElementById("k-nw-d").textContent = `assets ${fmt(data.assets)} · debts ${fmt(data.liabilities)}`;

  const axis = {axisLabel: {color: muted}, axisLine: {lineStyle: {color: muted}}, splitLine: {lineStyle: {color: "rgba(127,127,127,.15)"}}};
  chart("c-cat").setOption({
    color: PAL, tooltip: {trigger: "item", valueFormatter: v => fmt(v, c)},
    legend: {type: "scroll", bottom: 0, textStyle: {color: fg}},
    title: {text: fmt(data.expense), subtext: c, left: "center", top: "36%", textStyle: {color: fg, fontSize: 18}},
    series: [{type: "pie", radius: ["45%", "70%"], center: ["50%", "45%"], label: {show: false},
              data: data.by_category}]}, true);
  chart("c-cat").off("click");
  chart("c-cat").on("click", p => { filterCat = p.name; renderTx(); document.getElementById("txs").scrollIntoView({behavior: "smooth"}); });

  chart("c-daily").setOption({
    grid: {left: 44, right: 10, top: 10, bottom: 28}, tooltip: {trigger: "axis", valueFormatter: v => fmt(v, c)},
    xAxis: {type: "category", data: data.daily.map(d => d.date.slice(5)), ...axis},
    yAxis: {type: "value", ...axis},
    dataZoom: data.daily.length > 31 ? [{type: "inside"}] : [],
    series: [{type: "bar", data: data.daily.map(d => d.value), itemStyle: {color: "#2a78d6", borderRadius: [3,3,0,0]}}]}, true);

  chart("c-months").setOption({
    grid: {left: 50, right: 10, top: 30, bottom: 28}, tooltip: {trigger: "axis", valueFormatter: v => fmt(v, c)},
    legend: {top: 0, textStyle: {color: fg}},
    xAxis: {type: "category", data: data.months.map(m => m.month.slice(2)), ...axis}, yAxis: {type: "value", ...axis},
    series: [
      {name: "Income", type: "bar", data: data.months.map(m => m.income), itemStyle: {color: "#19a979"}},
      {name: "Expenses", type: "bar", data: data.months.map(m => m.expense), itemStyle: {color: "#e8743b"}},
      {name: "Saved", type: "line", data: data.months.map(m => +(m.income - m.expense).toFixed(2)), itemStyle: {color: "#2a78d6"}}]}, true);

  const h = data.net_worth_history || [];
  chart("c-nw").setOption({
    grid: {left: 60, right: 14, top: 10, bottom: 28}, tooltip: {trigger: "axis", valueFormatter: v => fmt(v, c)},
    xAxis: {type: "category", data: h.map(p => p.date), ...axis}, yAxis: {type: "value", scale: true, ...axis},
    dataZoom: h.length > 60 ? [{type: "inside"}] : [],
    series: [{type: "line", data: h.map(p => p.value), showSymbol: h.length < 40, smooth: false,
              itemStyle: {color: "#19a979"}, areaStyle: {opacity: 0.12}}]}, true);

  const accs = data.accounts.filter(a => a.value !== 0).sort((a, b) => b.value - a.value);
  chart("c-acc").setOption({
    grid: {left: 90, right: 20, top: 5, bottom: 20}, tooltip: {formatter: p => `${esc(p.name)}: ${fmt(accs[p.dataIndex].balance, accs[p.dataIndex].currency)}`},
    xAxis: {type: "value", ...axis}, yAxis: {type: "category", inverse: true, data: accs.map(a => a.name), ...axis},
    series: [{type: "bar", data: accs.map(a => ({value: a.value, itemStyle: {color: a.value < 0 ? "#e5484d" : "#2a78d6"}}))}]}, true);
  renderTx();
}

function renderTx() {
  const list = data.transactions.filter(t => !filterCat || t.category === filterCat);
  document.getElementById("clear").hidden = !filterCat;
  document.getElementById("txs").innerHTML = list.length ? list.slice(0, 150).map(t => `
    <div class="tx"><div class="w">${esc(t.what || t.category)}<div class="s">${esc(t.category)} · ${esc(t.account)} · ${t.date}</div></div>
    <div class="${t.amount < 0 ? "" : "pos"}" style="white-space:nowrap;text-align:right">${fmt(t.amount)}<div class="s">${esc(t.original)}</div></div></div>`).join("")
    : '<div class="s" style="color:var(--muted)">No transactions in this period.</div>';
}

document.getElementById("clear").onclick = () => { filterCat = null; renderTx(); };
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => load(b.dataset.p));
window.addEventListener("resize", () => Object.values(charts).forEach(ch => ch.resize()));
load(new URLSearchParams(location.search).get("period") || "month");
</script>
</body>
</html>
